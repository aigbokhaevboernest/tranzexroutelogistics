<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tranzex Route Logistics — Global Freight & Cargo Delivery</title>
    <meta name="description" content="Reliable courier and freight forwarding. Ocean, air & road freight with real-time tracking. Door-to-door delivery worldwide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Translate silent init -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: 'en', autoDisplay: false },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
  window.addEventListener('load', function () {
    // Get browser language e.g. "fr", "es", "zh-CN"
    const browserLang = navigator.language || navigator.userLanguage;
    const lang = browserLang.split('-')[0]; // get base language code

    // Don't translate if already English
    if (lang === 'en') return;

    // Wait for Google Translate to fully load
    const interval = setInterval(function () {
      const select = document.querySelector('.goog-te-combo');
      if (!select) return;
      clearInterval(interval);

      // Map browser code to Google Translate code
      const langMap = {
        zh: 'zh-CN',
        pt: 'pt',
        fr: 'fr',
        es: 'es',
        de: 'de',
        ar: 'ar',
        ru: 'ru',
        ja: 'ja',
        ko: 'ko',
        it: 'it',
        hi: 'hi',
      };

      const targetLang = langMap[lang] || lang;
      select.value = targetLang;
      select.dispatchEvent(new Event('change'));
    }, 500);
  });
</script>

    <style>
      #google_translate_element { display: none !important; }
      .goog-te-banner-frame { display: none !important; }
      body { top: 0 !important; }
      .skiptranslate { display: none !important; }
      iframe.skiptranslate { display: none !important; }
    </style>
  </head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
